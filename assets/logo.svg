<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Purple Sun Gradient (like the red circle in the reference) -->
    <radialGradient id="purpleSun" cx="48%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#b86bff"/>
      <stop offset="65%" stop-color="#8b2fc9"/>
      <stop offset="90%" stop-color="#6b149b"/>
      <stop offset="100%" stop-color="#4a0870"/>
    </radialGradient>
  </defs>

  <!-- Dark sketch paper background -->
  <rect width="128" height="128" rx="16" fill="#13101c"/>

  <!-- Ink Splatter Droplets (Background) -->
  <circle cx="18" cy="22" r="3" fill="#8b2fc9" opacity="0.6"/>
  <circle cx="26" cy="14" r="1.5" fill="#b86bff" opacity="0.7"/>
  <circle cx="14" cy="38" r="2" fill="#6b149b" opacity="0.5"/>
  <circle cx="108" cy="24" r="3.5" fill="#8b2fc9" opacity="0.6"/>
  <circle cx="116" cy="34" r="2" fill="#b86bff" opacity="0.5"/>
  <circle cx="112" cy="14" r="1.8" fill="#6b149b" opacity="0.6"/>
  <circle cx="110" cy="106" r="3" fill="#8b2fc9" opacity="0.7"/>
  <circle cx="118" cy="96" r="1.5" fill="#b86bff" opacity="0.5"/>
  <circle cx="22" cy="108" r="2.5" fill="#6b149b" opacity="0.6"/>
  <circle cx="14" cy="98" r="1.8" fill="#8b2fc9" opacity="0.5"/>

  <!-- Bold Purple Sun (Hand-drawn Ink Wash Circle) -->
  <circle cx="64" cy="64" r="46" fill="url(#purpleSun)"/>

  <!-- Sketchy Ink Splatter Marks on the Sun -->
  <circle cx="42" cy="36" r="4" fill="#13101c" opacity="0.4"/>
  <circle cx="86" cy="48" r="5" fill="#13101c" opacity="0.35"/>
  <circle cx="48" cy="88" r="3.5" fill="#13101c" opacity="0.4"/>
  <circle cx="78" cy="82" r="4.5" fill="#13101c" opacity="0.35"/>

  <!-- Hand-Drawn Ink Brush Eye / Watcher Silhouette -->
  <!-- Upper Brush Stroke -->
  <path d="M 28 64 C 42 42, 86 42, 100 64 C 84 50, 44 50, 28 64 Z" fill="#13101c"/>
  <!-- Lower Brush Stroke -->
  <path d="M 28 64 C 44 78, 84 78, 100 64 C 86 72, 42 72, 28 64 Z" fill="#13101c"/>

  <!-- Center Pupil with Ink Glow -->
  <circle cx="64" cy="64" r="11" fill="#13101c"/>
  <circle cx="64" cy="64" r="5.5" fill="#fdfbf7"/>
  <circle cx="66" cy="62" r="2" fill="#ffffff"/>

  <!-- Raw Sketch Hatching Lines -->
  <line x1="64" y1="20" x2="64" y2="30" stroke="#fdfbf7" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="64" y1="98" x2="64" y2="108" stroke="#fdfbf7" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="20" y1="64" x2="30" y2="64" stroke="#fdfbf7" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="98" y1="64" x2="108" y2="64" stroke="#fdfbf7" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
</svg>
