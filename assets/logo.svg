<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="squircleFrame">
      <rect x="0" y="0" width="128" height="128" rx="26" ry="26" />
    </clipPath>
  </defs>
  <g clip-path="url(#squircleFrame)">
    <!-- Warm Parchment Canvas -->
    <rect width="128" height="128" fill="#f4eedb" />

    <!-- Distant Mountain Ridge in Background -->
    <path d="M 0 102 Q 32 88 64 94 T 128 88 L 128 128 L 0 128 Z" fill="#dfccae" />

    <!-- Giant Crimson Red Sun behind/above the Eye -->
    <circle cx="64" cy="64" r="46" fill="#dc1419" />

    <!-- Outer Eye Lens (Bold Cartoon Ink Outline) -->
    <path d="M 12 64 C 26 38, 48 30, 64 30 C 80 30, 102 38, 116 64 C 102 90, 80 98, 64 98 C 48 98, 26 90, 12 64 Z" 
          fill="#fcfbf8" stroke="#141216" stroke-width="5.5" stroke-linejoin="round" />

    <!-- Upper Eyelid Crease / Shadow Arc -->
    <path d="M 22 62 C 34 44, 48 38, 64 38 C 80 38, 94 44, 106 62" fill="none" stroke="#141216" stroke-width="2" opacity="0.35" />

    <!-- Outer Iris Ring (Bold Ink Black) -->
    <circle cx="64" cy="64" r="24" fill="#141216" />

    <!-- Inner Core: Crimson Sun Pupil with Pure White Center Node -->
    <circle cx="64" cy="64" r="14" fill="#dc1419" stroke="#ffffff" stroke-width="2" />
    <circle cx="64" cy="64" r="5.5" fill="#ffffff" />

    <!-- Minimalist Circuit / Overwatch Surveillance Nodes (From Original Logo) -->
    <line x1="64" y1="36" x2="64" y2="43" stroke="#141216" stroke-width="3" stroke-linecap="round" />
    <line x1="64" y1="85" x2="64" y2="92" stroke="#141216" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="64" x2="32" y2="64" stroke="#141216" stroke-width="3" stroke-linecap="round" />
    <line x1="96" y1="64" x2="104" y2="64" stroke="#141216" stroke-width="3" stroke-linecap="round" />

    <!-- Outer Thick Cartoon Border -->
    <rect x="0" y="0" width="128" height="128" rx="26" ry="26" fill="none" stroke="#141216" stroke-width="5" />
  </g>
</svg>