<!DOCTYPE html>
<html lang="en" data-theme="purple">
  <head>
    <meta charset="utf-8" />
    <title>Overwatch</title>
    <style>
      :root {
        --paper-white: #fcfbf9;
        --ink-black: #111015;
        --ink-muted: #6b6875;
        --border-dark: #111015;
        --mint-cloud: #2dd4bf;
        --coral-wireframe: #e11d48;

        /* Saturated Block Theme Colors */
        --theme-block: #6b21a8;
        --theme-block-dark: #220638;
        --theme-block-surface: rgba(255, 255, 255, 0.1);
        --theme-block-border: rgba(255, 255, 255, 0.35);
        --text-on-theme: #ffffff;
        --text-on-theme-dim: rgba(255, 255, 255, 0.75);
      }

      /* Crimson palette option (Exact image match) */
      [data-theme="purple"] {
        --theme-block: #dc2626;
        --theme-block-dark: #3a0808;
        --theme-block-surface: rgba(0, 0, 0, 0.18);
        --theme-block-border: rgba(255, 255, 255, 0.4);
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        width: 410px;
        min-height: 540px;
        background-color: var(--paper-white);
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Arial", sans-serif;
        color: var(--ink-black);
        overflow-x: hidden;
        user-select: none;
        display: flex;
        flex-direction: column;
      }

      /* -------------------------------------------------------------
         TOP HALF: Pristine Ivory White Canvas (Swiss / Constructivist)
         ------------------------------------------------------------- */
      .top-section {
        background-color: var(--paper-white);
        padding: 16px 18px 14px 18px;
        position: relative;
        flex-shrink: 0;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* Hero Geometric Art Icon */
      .art-hero-icon {
        width: 42px;
        height: 42px;
        border: 1.5px solid var(--border-dark);
        border-radius: 4px;
        overflow: hidden;
        background: #ffffff;
        box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.15);
      }

      .art-hero-icon img {
        width: 100%;
        height: 100%;
        display: block;
      }

      .title-group h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: var(--ink-black);
      }

      .title-group p {
        margin: 1px 0 0 0;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--ink-muted);
      }

      /* Minimalist Swiss Stamp Status Pill */
      .status-stamp {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 4px 9px;
        border: 1.5px solid var(--border-dark);
        border-radius: 2px;
        background: #ffffff;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
      }

      .status-stamp.active {
        color: var(--ink-black);
      }

      .status-stamp.active .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
      }

      .status-stamp.paused {
        color: #ef4444;
      }

      .status-stamp.paused .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ef4444;
      }

      /* Top Section Card / Input */
      .input-block-label {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--ink-black);
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      textarea {
        width: 100%;
        padding: 9px 11px;
        font-size: 13px;
        color: var(--ink-black);
        background: #ffffff;
        border: 1.5px solid var(--border-dark);
        border-radius: 3px;
        outline: none;
        resize: vertical;
        min-height: 52px;
        line-height: 1.45;
        font-family: inherit;
        box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.08);
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      textarea:focus {
        border-color: var(--coral-wireframe);
        box-shadow: 3px 3px 0px var(--coral-wireframe);
      }

      .top-btn-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
      }

      /* Swiss Constructivist Minimalist Toggle */
      .construct-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 36px;
        height: 18px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #d1d5db;
        border: 1.5px solid var(--border-dark);
        transition: 0.2s;
        border-radius: 2px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 10px;
        width: 10px;
        left: 2px;
        bottom: 2px;
        background-color: var(--border-dark);
        transition: 0.2s;
        border-radius: 1px;
      }

      input:checked + .slider {
        background-color: var(--border-dark);
      }

      input:checked + .slider:before {
        transform: translateX(18px);
        background-color: #ffffff;
      }

      /* Clean Black Block Button */
      .block-btn {
        appearance: none;
        border: 1.5px solid var(--border-dark);
        border-radius: 2px;
        padding: 6px 13px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        background: var(--border-dark);
        color: #ffffff;
        box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.2);
        transition: all 0.15s ease;
      }

      .block-btn:hover:not(:disabled) {
        background: #ffffff;
        color: var(--border-dark);
      }

      .block-btn:active {
        transform: translate(1px, 1px);
        box-shadow: 1px 1px 0px rgba(0, 0, 0, 0.2);
      }

      /* -------------------------------------------------------------
         THE HORIZON BISECTION (Razor-sharp line from the artwork)
         ------------------------------------------------------------- */
      .horizon-bisection {
        width: 100%;
        height: 2px;
        background-color: var(--border-dark);
        position: relative;
        z-index: 2;
      }

      /* -------------------------------------------------------------
         BOTTOM HALF: Saturated Color Field (Bauhaus Purple / Crimson)
         ------------------------------------------------------------- */
      .bottom-section {
        background-color: var(--theme-block);
        color: var(--text-on-theme);
        padding: 14px 18px 16px 18px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        transition: background-color 0.3s ease;
      }

      /* Minimalist Saturated Cards */
      .theme-card {
        background: var(--theme-block-surface);
        border: 1.5px solid var(--theme-block-border);
        border-radius: 3px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }

      .theme-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .theme-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-on-theme);
      }

      /* Clean Saturated Inputs */
      .theme-card input[type="text"],
      .theme-card select {
        width: 100%;
        padding: 7px 10px;
        font-size: 12px;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.25);
        border: 1.5px solid var(--theme-block-border);
        border-radius: 2px;
        outline: none;
        font-family: inherit;
        box-sizing: border-box;
      }

      .theme-card select option {
        background: #2a0845;
        color: #ffffff;
      }

      .theme-card input:focus,
      .theme-card select:focus {
        border-color: #ffffff;
        background: rgba(0, 0, 0, 0.4);
      }

      /* White Outline Button */
      .theme-outline-btn {
        appearance: none;
        border: 1.5px solid #ffffff;
        border-radius: 2px;
        padding: 6px 12px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        background: transparent;
        color: #ffffff;
        transition: all 0.15s ease;
      }

      .theme-outline-btn:hover:not(:disabled) {
        background: #ffffff;
        color: var(--theme-block);
      }

      .theme-outline-btn-sm {
        padding: 3px 8px;
        font-size: 9px;
      }

      /* Tags */
      .tag-cloud {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 6px;
        max-height: 60px;
        overflow-y: auto;
      }

      .tag-item {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        padding: 2px 7px;
        font-size: 10.5px;
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .tag-del {
        cursor: pointer;
        font-weight: bold;
        opacity: 0.7;
      }

      .tag-del:hover {
        opacity: 1;
        color: #fca5a5;
      }

      /* Closed tabs list */
      .closed-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
        max-height: 100px;
        overflow-y: auto;
        margin-top: 4px;
      }

      .closed-item {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--theme-block-border);
        border-radius: 2px;
        padding: 6px 9px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .closed-info {
        flex: 1;
        min-width: 0;
      }

      .closed-title {
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #ffffff;
      }

      .closed-meta {
        font-size: 9.5px;
        color: var(--text-on-theme-dim);
      }

      .empty-state {
        text-align: center;
        font-size: 11px;
        color: var(--text-on-theme-dim);
        padding: 8px 0;
        letter-spacing: 0.5px;
      }

      .status-msg {
        font-size: 11px;
        font-weight: 600;
        margin-top: 6px;
        display: none;
      }

      .status-msg.ok {
        display: block;
        color: #10b981;
      }

      .status-msg.error {
        display: block;
        color: #ef4444;
      }

      /* Footer */
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--text-on-theme-dim);
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--theme-block-border);
      }

      .footer a {
        color: #ffffff;
        text-decoration: underline;
      }

      /* Palette Switcher Dots */
      .palette-toggle {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .dot-btn {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1px solid #ffffff;
        cursor: pointer;
        padding: 0;
      }

      .dot-purple { background: #6b21a8; }
      .dot-crimson { background: #dc2626; }

      /* Setup view card */
      #setup-view {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- TOP SECTION: Crisp White Canvas -->
    <div class="top-section">
      <!-- Header -->
      <div class="header">
        <div class="brand-wrap">
          <div class="art-hero-icon">
            <img src="assets/logo.svg" alt="Overwatch Graphic Artwork" />
          </div>
          <div class="title-group">
            <h1>OVERWATCH</h1>
            <p>JEV TAB FILTER // SYSTEM ONE</p>
          </div>
        </div>
        <div id="statusBadge" class="status-stamp active">
          <span class="dot"></span>
          <span>ACTIVE</span>
        </div>
      </div>

      <!-- Setup View (When API Key is missing) -->
      <div id="setup-view">
        <div class="input-block-label">TYPESAFE API KEY</div>
        <input
          id="apiKey"
          type="password"
          placeholder="ts_live_..."
          autocomplete="off"
          style="width: 100%; padding: 8px 10px; font-size: 12px; border: 1.5px solid var(--border-dark); border-radius: 2px; outline: none; margin-bottom: 8px;"
        />
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 10px; color: var(--ink-muted);">KEY FROM CONSOLE.TYPESAFE.AI</span>
          <div style="display: flex; gap: 6px;">
            <button id="saveKeyBtn" class="block-btn">SAVE KEY</button>
            <button id="openConsoleBtn" class="block-btn" style="background: #ffffff; color: #111;">CONSOLE</button>
          </div>
        </div>
        <div id="setupStatus" class="status-msg"></div>
      </div>

      <!-- Main Focus Prompt (Top Canvas) -->
      <div id="prompt-panel">
        <div class="input-block-label">
          <span>CURRENT WORK PROMPT</span>
          <div class="construct-toggle">
            <span>FILTER</span>
            <label class="switch" title="Toggle Tab Filter">
              <input id="monitoringToggle" type="checkbox" checked />
              <span class="slider"></span>
            </label>
          </div>
        </div>
        <textarea
          id="workPrompt"
          placeholder="e.g. Building an auth service in Go"
        ></textarea>
        <div class="top-btn-row">
          <span style="font-size: 10px; color: var(--ink-muted); font-weight: 500;">MONITORS NEW & ACTIVE TABS</span>
          <button id="savePromptBtn" class="block-btn">UPDATE PROMPT</button>
        </div>
        <div id="goalStatus" class="status-msg"></div>
      </div>
    </div>

    <!-- HORIZON BISECTION LINE -->
    <div class="horizon-bisection"></div>

    <!-- BOTTOM SECTION: Saturated Color Field (Bauhaus Purple / Crimson) -->
    <div class="bottom-section">
      <!-- Mode Selection -->
      <div class="theme-card">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span class="theme-label">ON UNRELATED TAB:</span>
          <select id="enforcementSelect" style="width: auto; padding: 4px 8px; font-size: 11px;">
            <option value="grace">5S WARNING</option>
            <option value="instant">CLOSE IMMEDIATELY</option>
          </select>
        </div>
      </div>

      <!-- Allowed Domains -->
      <div class="theme-card">
        <div class="theme-label" style="margin-bottom: 5px;">ALLOWED DOMAINS</div>
        <div style="display: flex; gap: 6px;">
          <input
            id="newDomainInput"
            type="text"
            placeholder="e.g. youtube.com"
            style="flex: 1;"
          />
          <button id="addDomainBtn" class="theme-outline-btn">ADD</button>
        </div>
        <div id="allowedTags" class="tag-cloud">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Closed Tabs -->
      <div class="theme-card">
        <div class="theme-card-header">
          <span class="theme-label">RECENTLY CLOSED</span>
          <button id="clearGraveyardBtn" class="theme-outline-btn theme-outline-btn-sm">CLEAR</button>
        </div>
        <div id="graveyardList" class="closed-list">
          <div class="empty-state">No closed tabs.</div>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer">
        <div style="display: flex; gap: 8px; align-items: center;">
          <span>OVERWATCH // JEV</span>
          <span>•</span>
          <a id="changeKeyBtn" href="#">API KEY</a>
        </div>
        <div class="palette-toggle" title="Switch Poster Palette">
          <button id="setPurpleTheme" class="dot-btn dot-purple" title="Purple Theme"></button>
          <button id="setCrimsonTheme" class="dot-btn dot-crimson" title="Crimson Artwork Theme"></button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
