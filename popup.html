<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Overwatch</title>
    <style>
      :root {
        --paper-bg: #110e1a;
        --card-bg: #181424;
        --card-border: rgba(168, 85, 247, 0.22);
        --card-border-hover: rgba(168, 85, 247, 0.45);

        --purple-sun: #9333ea;
        --purple-bright: #a855f7;
        --purple-glow: #c084fc;
        --purple-soft: rgba(168, 85, 247, 0.15);

        --text-primary: #f8f6fc;
        --text-secondary: #a79fb8;
        --text-muted: #726885;

        --danger: #f43f5e;
        --success: #10b981;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 18px 20px;
        background-color: var(--paper-bg);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        width: 410px;
        min-height: 480px;
        position: relative;
        overflow-x: hidden;
      }

      /* Bold Purple Sun (Hand-drawn Ink Wash Artwork from Reference) */
      .ink-sun-graphic {
        position: absolute;
        top: -45px;
        right: -45px;
        width: 170px;
        height: 170px;
        border-radius: 50%;
        background: radial-gradient(circle, #a855f7 0%, #7e22ce 55%, #3b0764 85%, transparent 100%);
        opacity: 0.42;
        filter: blur(8px);
        pointer-events: none;
        z-index: 0;
      }

      /* Ink Splatter specks */
      .ink-splatter {
        position: absolute;
        top: 24px;
        right: 125px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--purple-bright);
        box-shadow:
          -18px 16px 0 2px var(--purple-sun),
          20px -10px 0 1.5px var(--purple-glow),
          -12px 34px 0 1px var(--purple-bright),
          -32px 14px 0 1.5px rgba(168, 85, 247, 0.6),
          8px 48px 0 2px var(--purple-glow);
        opacity: 0.55;
        pointer-events: none;
        z-index: 0;
      }

      .content-wrapper {
        position: relative;
        z-index: 1;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--card-border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1.5px solid var(--card-border-hover);
        overflow: hidden;
        background: var(--card-bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand-logo img {
        width: 100%;
        height: 100%;
      }

      .brand-info h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.2px;
      }

      .brand-info p {
        margin: 1px 0 0 0;
        font-size: 11.5px;
        color: var(--text-muted);
      }

      /* Clean Status Pill */
      .status-pill {
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 9999px;
        border: 1px solid var(--card-border);
        background: rgba(24, 20, 36, 0.8);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-pill.active {
        color: var(--purple-glow);
        border-color: rgba(168, 85, 247, 0.4);
      }

      .status-pill.active .indicator {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--purple-bright);
        box-shadow: 0 0 8px var(--purple-bright);
      }

      .status-pill.paused {
        color: var(--danger);
        border-color: rgba(244, 63, 94, 0.3);
      }

      .status-pill.paused .indicator {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--danger);
      }

      /* Clean Sketch Cards */
      .sketch-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 14px 15px;
        margin-bottom: 12px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
        transition: border-color 0.2s ease;
      }

      .sketch-card:hover {
        border-color: var(--card-border-hover);
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .card-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      /* Inputs */
      label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 6px;
      }

      input[type="text"],
      input[type="password"],
      select,
      textarea {
        width: 100%;
        padding: 10px 12px;
        font-size: 13px;
        color: var(--text-primary);
        background: #0f0c18;
        border: 1px solid var(--card-border);
        border-radius: 8px;
        outline: none;
        box-sizing: border-box;
        transition: border-color 0.2s, box-shadow 0.2s;
        font-family: inherit;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--purple-bright);
        box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
      }

      textarea {
        resize: vertical;
        min-height: 56px;
        line-height: 1.45;
      }

      /* Buttons */
      .btn {
        appearance: none;
        border: none;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.1s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--purple-bright), var(--purple-sun));
        color: #ffffff;
        box-shadow: 0 2px 10px rgba(168, 85, 247, 0.3);
      }

      .btn-primary:hover:not(:disabled) {
        opacity: 0.92;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-primary);
        border: 1px solid var(--card-border);
      }

      .btn-secondary:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--card-border-hover);
      }

      .btn-sm {
        padding: 6px 11px;
        font-size: 11.5px;
      }

      /* Minimalist Smooth Switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 20px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(255, 255, 255, 0.15);
        transition: 0.25s;
        border-radius: 20px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: #ffffff;
        transition: 0.25s;
        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: var(--purple-bright);
      }

      input:checked + .slider:before {
        transform: translateX(18px);
      }

      /* Domain Tags */
      .tag-container {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
        max-height: 75px;
        overflow-y: auto;
      }

      .tag {
        background: rgba(168, 85, 247, 0.1);
        border: 1px solid rgba(168, 85, 247, 0.2);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 11px;
        color: var(--text-primary);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .tag-remove {
        cursor: pointer;
        color: var(--text-muted);
        font-weight: bold;
      }

      .tag-remove:hover {
        color: var(--danger);
      }

      /* Closed Tabs list */
      .graveyard-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 130px;
        overflow-y: auto;
        margin-top: 6px;
      }

      .graveyard-item {
        background: #0f0c18;
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 8px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .graveyard-info {
        flex: 1;
        min-width: 0;
      }

      .graveyard-title {
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text-primary);
      }

      .graveyard-meta {
        font-size: 10.5px;
        color: var(--text-muted);
        display: flex;
        gap: 6px;
      }

      .empty-state {
        text-align: center;
        font-size: 12px;
        color: var(--text-muted);
        padding: 12px 0;
      }

      .status-msg {
        font-size: 11.5px;
        margin-top: 8px;
        display: none;
      }

      .status-msg.ok {
        display: block;
        color: var(--purple-glow);
      }

      .status-msg.error {
        display: block;
        color: var(--danger);
      }

      /* Footer */
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--card-border);
      }

      a {
        color: var(--purple-glow);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      #setup-view {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Hand-drawn Ink Sun Artwork Element (Reference Style) -->
    <div class="ink-sun-graphic"></div>
    <div class="ink-splatter"></div>

    <div class="content-wrapper">
      <!-- Header -->
      <div class="header">
        <div class="brand">
          <div class="brand-logo">
            <img src="assets/logo.svg" alt="Overwatch Logo" />
          </div>
          <div class="brand-info">
            <h1>Overwatch</h1>
            <p>Tab distraction blocker</p>
          </div>
        </div>
        <div id="statusBadge" class="status-pill active">
          <span class="indicator"></span>
          <span>Active</span>
        </div>
      </div>

      <!-- Setup View (When API Key is missing) -->
      <div id="setup-view" class="sketch-card">
        <div class="card-label" style="margin-bottom: 6px;">Setup TypeSafe API Key</div>
        <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 12px 0; line-height: 1.4;">
          Enter your TypeSafe API key to enable fast tab monitoring with Jev.
        </p>
        <label for="apiKey">API Key</label>
        <input
          id="apiKey"
          type="password"
          placeholder="ts_live_..."
          autocomplete="off"
        />
        <p style="font-size: 11px; color: var(--text-muted); margin: 6px 0 12px 0;">
          Get your key from <a href="https://console.typesafe.ai/keys" target="_blank" rel="noopener noreferrer">console.typesafe.ai</a>
        </p>
        <div style="display: flex; gap: 8px;">
          <button id="saveKeyBtn" class="btn btn-primary" style="flex: 1;">Save Key</button>
          <button id="openConsoleBtn" class="btn btn-secondary">Open Console</button>
        </div>
        <div id="setupStatus" class="status-msg"></div>
      </div>

      <!-- Main View -->
      <div id="main-view">
        <!-- Goal Card -->
        <div class="sketch-card">
          <div class="card-header">
            <span class="card-label">What are you working on?</span>
            <label class="switch" title="Toggle Monitoring">
              <input id="monitoringToggle" type="checkbox" checked />
              <span class="slider"></span>
            </label>
          </div>
          <textarea
            id="workPrompt"
            placeholder="e.g. Building an auth service in Go"
          ></textarea>
          <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
            <button id="savePromptBtn" class="btn btn-primary btn-sm">Save Prompt</button>
          </div>
          <div id="goalStatus" class="status-msg"></div>
        </div>

        <!-- Mode -->
        <div class="sketch-card">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
              <div class="card-label">On unrelated tab:</div>
            </div>
            <select id="enforcementSelect" style="width: auto; padding: 6px 10px; font-size: 12px;">
              <option value="grace">5s Warning</option>
              <option value="instant">Close immediately</option>
            </select>
          </div>
        </div>

        <!-- Allowed Domains -->
        <div class="sketch-card">
          <div class="card-label" style="margin-bottom: 6px;">Allowed domains</div>
          <div style="display: flex; gap: 8px;">
            <input
              id="newDomainInput"
              type="text"
              placeholder="e.g. youtube.com"
              style="flex: 1;"
            />
            <button id="addDomainBtn" class="btn btn-secondary btn-sm">Add</button>
          </div>
          <div id="allowedTags" class="tag-container">
            <!-- Dynamically populated -->
          </div>
        </div>

        <!-- Closed Tabs -->
        <div class="sketch-card">
          <div class="card-header">
            <span class="card-label">Recently closed</span>
            <button id="clearGraveyardBtn" class="btn btn-secondary btn-sm" style="font-size: 10px; padding: 2px 7px;">Clear</button>
          </div>
          <div id="graveyardList" class="graveyard-list">
            <div class="empty-state">No closed tabs yet.</div>
          </div>
        </div>

        <!-- Footer -->
        <div class="footer">
          <span>Powered by <strong>Jev</strong></span>
          <a id="changeKeyBtn" href="#">API key</a>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
